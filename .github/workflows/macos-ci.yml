name: macOS Remote VNC via Tailscale

on:
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击运行

jobs:
  macos-vnc-session:
    runs-on: macos-latest # 使用 GitHub 提供的最新 macOS 环境 (M系列芯片)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 接入 Tailscale 网络（改用你手里的 Auth Key 方式）
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      # 2. 开启 macOS 原生远程桌面服务并打通权限
      - name: Setup macOS Native VNC
        run: |
          # 开启原生 ARD (Apple Remote Desktop) 远程管理
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all

          # 【核心避坑点】直接修改当前活跃 GUI 用户 (runner) 的系统密码
          # GitHub 默认的桌面和模拟器都在 runner 用户下运行，改它的密码才能直接看到正在跑的测试
          echo "${{ secrets.USER_PASSWORD }}" | sudo dscl . -passwd /Users/runner

          # 重启并激活远程管理服务
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate

      # 3. 输出连接信息并挂起流水线
      - name: Keep Alive & Show Connection Info
        run: |
          echo "=========================================================="
          echo "🎉 macOS 原生 VNC 服务已成功通过 Tailscale 穿透！"
          echo "----------------------------------------------------------"
          echo "请在你的本地电脑上使用以下信息连接："
          echo "目标 IP 地址: $(tailscale ip -4)"
          echo "登录用户名: runner"
          echo "登录密码: （你在 GitHub Secrets 中设置的 VNC_PASSWORD）"
          echo "=========================================================="
          echo "流水线将保持运行 1 小时，超时后会自动销毁..."

          # 挂起 1 小时供你尽情调试，可以根据需要修改时间（单位：秒）
          sleep 3600