name: Extract WASM Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要处理的 Tag (对应上游 release 版本号)"
        required: true
      prerelease_flag:
        description: "是否标记为预发布 (Pre-release)"
        type: boolean
        default: false
      draft_flag:
        description: "是否存为草稿 (Draft)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract-wasm:
    name: Extract WASM (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-apple-darwin
            asset: moonlight-web-aarch64-apple-darwin.tar.gz
          - name: aarch64-unknown-linux-gnu
            asset: moonlight-web-aarch64-unknown-linux-gnu.tar.gz
          - name: aarch64-unknown-linux-musl
            asset: moonlight-web-aarch64-unknown-linux-musl.tar.gz
          - name: x86_64-apple-darwin
            asset: moonlight-web-x86_64-apple-darwin.tar.gz
          - name: x86_64-pc-windows-gnu
            asset: moonlight-web-x86_64-pc-windows-gnu.zip
          - name: x86_64-unknown-linux-gnu
            asset: moonlight-web-x86_64-unknown-linux-gnu.tar.gz
          - name: x86_64-unknown-linux-musl
            asset: moonlight-web-x86_64-unknown-linux-musl.tar.gz

    steps:
      - name: Download upstream archive
        run: |
          URL="https://github.com/MrCreativ3001/moonlight-web-stream/releases/download/${{ inputs.tag }}/${{ matrix.asset }}"
          echo "Downloading $URL"
          curl -fL --retry 3 -o archive "$URL"

      - name: Extract WASM (keep original hashed filename)
        run: |
          mkdir -p extracted out
          case "${{ matrix.asset }}" in
            *.zip) unzip -q archive -d extracted ;;
            *.tar.gz) tar -xzf archive -C extracted ;;
            *) echo "Unknown archive type: ${{ matrix.asset }}"; exit 1 ;;
          esac

          # 只提取 wasm，保留原始 hash 文件名（与 archive 内 stream.js 的引用一致）
          find extracted -name '*.wasm' -exec cp {} out/ \;

          echo "Extracted:"
          ls -la out
          test -n "$(ls -A out)" || { echo "No .wasm found in ${{ matrix.asset }}"; exit 1; }

      - name: Upload WASM to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Release ${{ inputs.tag }}"
          draft: ${{ inputs.draft_flag }}
          prerelease: ${{ inputs.prerelease_flag }}
          files: out/*.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
