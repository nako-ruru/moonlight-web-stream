name: Static ZIP CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 Tag (对应母仓库版本号)"
        required: true
      prerelease_flag:
        description: "是否标记为预发布 (Pre-release)"
        type: boolean
        default: false
      draft_flag:
        description: "是否存为草稿 (Draft)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-static:
    name: Build Static ZIP and WASM Asset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          repository: MrCreativ3001/moonlight-web-stream
          ref: ${{ github.event.inputs.tag }}

      # Install node
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install rust (needed for prebuild scripts like generate-bindings)
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-13
          targets: wasm32-unknown-unknown

      - name: Build Web
        run: |
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-02-13
          cargo install wasm-bindgen-cli --version 0.2.128
          npm ci
          npm run build
          mv dist static

      - name: Separate WASM and create static.zip
        run: |
          # 提取 wasm 到根目录，保留原始 hash 文件名（不重命名）
          find static -name "*.wasm" -exec cp {} . \;
          # 从 static.zip 中排除 wasm，减小预热包体积
          find static -name "*.wasm" -delete

          zip -r static.zip static

      - name: Upload static.zip and wasm to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Release ${{ github.event.inputs.tag }}"
          draft: ${{ github.event.inputs.draft_flag }}
          prerelease: ${{ github.event.inputs.prerelease_flag }}
          files: |
            static.zip
            *.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}