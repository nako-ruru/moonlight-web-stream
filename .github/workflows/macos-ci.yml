name: Extract WASM Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要处理的 Tag (对应上游 release 版本号)"
        required: true
      prerelease_flag:
        description: "是否标记为预发布 (Pre-release)"
        type: boolean
        default: false
      draft_flag:
        description: "是否存为草稿 (Draft)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract-wasm:
    name: Extract and dedup WASM
    runs-on: ubuntu-latest

    steps:
      # 单 job 下载全部上游 archive（不用 matrix，避免多 job 上传同名 asset 互相覆盖）
      - name: Download all upstream archives
        run: |
          set -euo pipefail
          mkdir -p archives
          ASSETS=(
            moonlight-web-aarch64-apple-darwin.tar.gz
            moonlight-web-aarch64-unknown-linux-gnu.tar.gz
            moonlight-web-aarch64-unknown-linux-musl.tar.gz
            moonlight-web-x86_64-apple-darwin.tar.gz
            moonlight-web-x86_64-pc-windows-gnu.zip
            moonlight-web-x86_64-unknown-linux-gnu.tar.gz
            moonlight-web-x86_64-unknown-linux-musl.tar.gz
          )
          for asset in "${ASSETS[@]}"; do
            url="https://github.com/MrCreativ3001/moonlight-web-stream/releases/download/${{ inputs.tag }}/${asset}"
            echo "Downloading ${url}"
            curl -fL --retry 3 -o "archives/${asset}" "${url}"
          done
          ls -la archives

      # 逐个 archive 提取 wasm，日志里记录每个 archive 提取出的 wasm 名字/大小/hash；
      # 同名 wasm 必须 size+hash 完全一致才视为合法，否则 fail 等人工介入。
      - name: Extract WASM and verify duplicates are identical
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          ARCHIVES_DIR = Path("archives")
          OUT_DIR = Path("out")

          def sha256_of(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def handle_entry(name_in_archive: str, data: bytes, seen: dict) -> int:
              name = Path(name_in_archive).name
              size = len(data)
              sha = sha256_of(data)
              print(f"  extracted: {name} (size={size} sha256={sha})")
              if name in seen:
                  prev_size, prev_sha = seen[name]
                  if prev_sha == sha and prev_size == size:
                      print(f"    -> duplicate of already seen '{name}', identical size+hash, OK")
                      return 0
                  print(
                      f"::error::Same wasm name '{name}' with DIFFERENT content across archives "
                      f"(first seen size={prev_size} sha256={prev_sha} vs size={size} sha256={sha}). "
                      f"Manual intervention required."
                  )
                  return 1
              seen[name] = (size, sha)
              (OUT_DIR / name).write_bytes(data)
              print(f"    -> new wasm, added to out/")
              return 0

          def main() -> int:
              OUT_DIR.mkdir(exist_ok=True)
              seen: dict = {}
              mismatch = 0
              for archive in sorted(ARCHIVES_DIR.iterdir()):
                  print(f"=== {archive.name} ===")
                  found_any = False
                  if archive.name.endswith(".tar.gz"):
                      with tarfile.open(archive, "r:gz") as tf:
                          for m in tf.getmembers():
                              if not (m.isfile() and m.name.endswith(".wasm")):
                                  continue
                              found_any = True
                              data = tf.extractfile(m).read()
                              mismatch |= handle_entry(m.name, data, seen)
                  elif archive.name.endswith(".zip"):
                      with zipfile.ZipFile(archive) as zf:
                          for info in zf.infolist():
                              if info.is_dir() or not info.filename.endswith(".wasm"):
                                  continue
                              found_any = True
                              data = zf.read(info.filename)
                              mismatch |= handle_entry(info.filename, data, seen)
                  else:
                      print(f"::error::Unknown archive type: {archive.name}")
                      return 1

                  if not found_any:
                      print(f"::error::No .wasm found in {archive.name}")
                      return 1

              if mismatch:
                  print("::error::Duplicate wasm names resolved to different content; refusing to publish.")
                  return 1

              print("=== Deduplicated WASM to publish ===")
              for f in sorted(OUT_DIR.iterdir()):
                  print(f"  {f.name} size={f.stat().st_size}")
              print("SCRIPT_OK")
              return 0

          sys.exit(main())
          PYEOF

      - name: Upload WASM to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Release ${{ inputs.tag }}"
          draft: ${{ inputs.draft_flag }}
          prerelease: ${{ inputs.prerelease_flag }}
          files: out/*.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
