name: macOS Interactive GUI (Tailscale)
on: [workflow_dispatch] # 支持手动点击触发

jobs:
  interactive-test:
    runs-on: macos-14 # M系列芯片环境
    steps:
      - uses: actions/checkout@v4
      - name: Run Unified Setup
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: bash ./scripts/setup-mac-gui.sh