name: macOS Remote VNC via Tailscale

on:
  workflow_dispatch: # 允许手动触发

jobs:
  macos-vnc-session:
    runs-on: macos-latest # 使用 GitHub 提供的最新 macOS 环境

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 接入 Tailscale 网络
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      # 2. 开启 macOS 原生远程桌面服务并打通权限
      - name: Setup macOS Native VNC
        run: |
          # 【修复 1】使用 dscl 代替 sysadminctl 修改密码，绕过 Secure Token 限制
          sudo dscl . -passwd /Users/runner "${{ secrets.VNC_PASSWORD }}"
          
          # 【修复 2】明确指定只为 runner 用户开启远程控制权限，规避全开导致的 TCC 屏蔽
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -specifiedUsers
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -access -on -privs -all -users runner
          
          # 重启并激活远程管理服务
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -console
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate

      # 3. 输出连接信息并挂起流水线
      - name: Keep Alive & Show Connection Info
        run: |
          echo "=========================================================="
          echo "🎉 macOS 原生 VNC 服务已成功通过 Tailscale 穿透！"
          echo "----------------------------------------------------------"
          echo "请在你的本地电脑上使用以下信息连接："
          echo "目标 IP 地址: $(tailscale ip -4)"
          echo "登录用户名: runner"
          echo "登录密码: （你在 GitHub Secrets 中设置的 VNC_PASSWORD）"
          echo "=========================================================="
          echo "流水线将保持运行 1 小时，超时后会自动销毁..."

          # 挂起 1 小时供调试
          sleep 3600